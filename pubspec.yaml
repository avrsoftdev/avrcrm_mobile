name: avrcrm
description: AVRCRM - Modern CRM Mobile App for DG-PV Synchronization & Business Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  badges: ^3.1.2

  # Supabase
  supabase_flutter: ^2.9.1
  csv: ^8.0.0
  file_picker: ^12.1.3
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
